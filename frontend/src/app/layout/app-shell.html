<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to main content</a>

<header class="app-header">
  <div class="header-content">
    <a class="brand" routerLink="/employees" aria-label="Salary Management home">
      <span class="brand-mark" aria-hidden="true">SM</span>
      <span class="brand-copy">
        <span class="brand-name">Salary Management</span>
        <span class="brand-description">People &amp; compensation</span>
      </span>
    </a>

    <nav aria-label="Primary">
      <a
        matButton
        class="nav-link"
        routerLink="/employees"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        >Employees</a
      >
      <a
        matButton
        class="nav-link"
        routerLink="/analytics"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        >Analytics</a
      >
    </nav>
    @if (session.user(); as user) {
      <div class="account-controls">
        <span class="account-name" [title]="user.username">{{ user.username }}</span>
        <button matButton type="button" (click)="logout()" [disabled]="signingOut()">
          Sign out
        </button>
      </div>
    }
  </div>
</header>

<main #mainContent id="main-content" class="main-content" tabindex="-1">
  @if (signingOut()) {
    <p role="status">Signing out…</p>
  }
  @if (logoutError(); as message) {
    <p class="logout-error" role="alert">{{ message }}</p>
  }
  <router-outlet />
</main>

<footer class="app-footer">Employee Salary Management</footer>
